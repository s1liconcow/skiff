apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: registry.example.com/payments-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: info
            - name: FEATURE_FLAG
              valueFrom:
                configMapKeyRef:
                  name: payments-config
                  key: FEATURE_FLAG
          readinessProbe:
            httpGet:
              path: /ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: staging
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api
  namespace: staging
spec:
  tls:
    - secretName: payments-tls
  rules:
    - host: payments.staging.example.com
      http:
        paths:
          - path: /
            backend:
              service:
                name: payments-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-api
  namespace: staging
spec:
  scaleTargetRef:
    kind: Deployment
    name: payments-api
  minReplicas: 2
  maxReplicas: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: staging
data:
  FEATURE_FLAG: enabled
