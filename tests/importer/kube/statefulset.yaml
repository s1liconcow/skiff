[
  {
    "apiVersion": "apps/v1",
    "kind": "StatefulSet",
    "metadata": {
      "name": "postgres",
      "namespace": "prod"
    },
    "spec": {
      "serviceName": "postgres",
      "replicas": 3,
      "selector": {
        "matchLabels": {
          "app": "postgres"
        }
      },
      "template": {
        "metadata": {
          "labels": {
            "app": "postgres"
          }
        },
        "spec": {
          "containers": [
            {
              "name": "postgres",
              "image": "postgres:16@sha256:1111111111111111111111111111111111111111111111111111111111111111",
              "ports": [
                {
                  "name": "sql",
                  "containerPort": 5432
                }
              ],
              "volumeMounts": [
                {
                  "name": "data",
                  "mountPath": "/var/lib/postgresql/data"
                }
              ],
              "readinessProbe": {
                "httpGet": {
                  "path": "/healthz",
                  "port": 5432
                }
              }
            }
          ]
        }
      },
      "volumeClaimTemplates": [
        {
          "metadata": {
            "name": "data"
          },
          "spec": {
            "storageClassName": "gp3",
            "resources": {
              "requests": {
                "storage": "20Gi"
              }
            }
          }
        }
      ]
    }
  },
  {
    "apiVersion": "v1",
    "kind": "Service",
    "metadata": {
      "name": "postgres",
      "namespace": "prod"
    },
    "spec": {
      "selector": {
        "app": "postgres"
      },
      "ports": [
        {
          "name": "sql",
          "port": 5432,
          "targetPort": 5432
        }
      ]
    }
  }
]
