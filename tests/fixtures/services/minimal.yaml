apiVersion: skiff.dev/v1alpha1
kind: Service
metadata:
  name: payments-api
  env: prod
artifact:
  type: oci
  ref: registry.example.com/payments-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
runtime:
  port: 8080
  command:
    - ./app
    - serve
  health:
    path: /healthz
machine:
  size: small
scale:
  min: 1
  max: 2
network:
  ingress:
    type: private
