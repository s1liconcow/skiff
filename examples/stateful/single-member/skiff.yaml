apiVersion: skiff.dev/v1alpha1
kind: StatefulGroup
metadata:
  name: ledger-stream
  env: prod
  labels:
    app: ledger
    tier: stateful-messaging
    region: us-west-2
stateful:
  replicas: 1
  members:
    - ordinal: 0
      zone: us-west-2a
      dnsName: ledger-stream-0.state.prod.internal.example.com
  volume:
    size: 50Gi
    type: gp3
    mountPath: /var/lib/nats
    encrypted: true
  identity:
    dnsZoneRef: route53://Z0123456789EXAMPLE/prod.internal.example.com
    hostnamePrefix: ledger-stream
  recipe:
    name: nats-jetstream-single
    config:
      artifact:
        type: oci
        ref: docker.io/library/nats:2.14.0@sha256:ddb480f4b97d90f183123e96bbc7c96ab2a126883f7a380531cc208fc8ba9ca7
      runtime:
        command:
          - /usr/local/bin/nats-server
          - --jetstream
          - --store_dir
          - /var/lib/nats
        ports:
          client: 4222
          monitoring: 8222
        health:
          path: /healthz
          port: 8222
        metrics:
          path: /metrics
          port: 8222
      streams:
        - name: LEDGER
          subjects:
            - ledger.>
          storage: file
          retention: limits
          maxAge: 168h
      snapshots:
        enabled: true
        interval: 30m
        retention: 14d
      recovery:
        requireFencing: true
        replaceMemberSaga: stateful.replace_member
        maxUnavailableMembers: 1
  update:
    strategy: ordered
