name: e2e

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "e2e mode to run"
        required: true
        default: "local"
        type: choice
        options:
          - local
          - apple
          - aws
          - all
  schedule:
    - cron: "17 9 * * *"

jobs:
  local:
    if: github.event_name == 'schedule' || inputs.mode == 'local' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Local e2e
        run: make e2e-local

  apple:
    if: inputs.mode == 'apple' || inputs.mode == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Apple silicon e2e
        run: make e2e-apple-container

  aws:
    if: github.event_name == 'schedule' || inputs.mode == 'aws' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    env:
      SKIFF_AWS_E2E_STATE: ${{ secrets.SKIFF_AWS_E2E_STATE }}
      SKIFF_AWS_E2E_REGION: ${{ secrets.SKIFF_AWS_E2E_REGION }}
      SKIFF_AWS_E2E_PREFIX: skiff-e2e-${{ github.run_id }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: AWS e2e smoke
        run: make e2e-aws
