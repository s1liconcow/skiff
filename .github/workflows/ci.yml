name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal tests -name '*.go' -print))"
      - name: Conformance
        run: go test ./tests/conformance/...
      - name: Local e2e
        run: make e2e-local
      - name: Production readiness
        run: make readiness
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
