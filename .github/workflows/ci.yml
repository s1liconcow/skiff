name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal tests -name '*.go' -print))"
      - name: Conformance
        run: go test ./tests/conformance/...
      - name: Local e2e
        run: make e2e-local
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
